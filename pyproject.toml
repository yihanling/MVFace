[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mvface"
version = "0.1.0"
description = "Multi-view 3D facial landmark estimation from calibrated RGB-D views"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "torch",
    "torchvision",
    "matplotlib",   # tools/viz_pred_vs_gt.py
]

[project.optional-dependencies]

# Data generation only (tools/render_views.py); training and eval never need it.
# Install with:  bash setup_render.sh
render = [
    "pyrender>=0.1.45",
    "trimesh",
    "opencv-python",
    "tqdm",
]

data_collection = [
    "opencv-python",
    "pyrealsense2; sys_platform != 'darwin'",         # official RealSense SDK wheels: Windows/Linux only
    "pyrealsense2-macosx; sys_platform == 'darwin'",  # community macOS build, same `import pyrealsense2` API
]

all = ["mvface[render,data_collection]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mvface = ["assets/*.npy", "assets/*.npz", "assets/*.json"]
